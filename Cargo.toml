[package]
name = "oauth2-mock"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
percent-encoding = "2.3.2"
rand = "0.8.5"
rsa = { version = "0.9.10", features = ["sha2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal"] }
url = "2.5.8"

[dev-dependencies]
openidconnect = { version = "4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }

[profile.dev.package."*"]
opt-level = 3
