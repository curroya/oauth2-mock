name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: docker.io/curroya/oauth2-mock
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  version:
    name: Compute the version
    needs: ci
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.semver.outputs.version_tag }}
    steps:
      - name: Refuse a release of anything but main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "a release is cut from main; dispatch from main" >&2
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: semver
        uses: PaulHatch/semantic-version@79147b94804704a613626766998afe7b2bd0bb47 # v6.0.5
        with:
          search_commit_body: true

  image:
    name: Publish to Docker Hub
    needs: version
    runs-on: ubuntu-24.04
    environment:
      name: dockerhub
      url: https://hub.docker.com/r/curroya/oauth2-mock
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      # A re-run of an older run would otherwise overwrite a newer release's images.
      - name: Refuse a version that is already tagged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tagged=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$TAG" \
            --jq 'map(select(.ref == "refs/tags/" + env.TAG)) | length')
          if [ "$tagged" -ne 0 ]; then
            echo "$TAG is already tagged; push a new commit to main to release again" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: The published image serves discovery
        run: |
          docker run -d --name oauth2-mock -p 5556:5556 "$IMAGE:$TAG"
          for _ in $(seq 1 20); do
            curl -sf http://localhost:5556/.well-known/openid-configuration && exit 0
            sleep 1
          done
          docker logs oauth2-mock
          exit 1

  release:
    name: Tag and release
    needs: [version, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # pushes the tag and creates the release
    env:
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Release notes from the commits since the previous tag
        run: |
          previous_tag=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          range=${previous_tag:+$previous_tag..}HEAD
          git log --no-merges --format='- %s (%h)' "$range" > "$RUNNER_TEMP/notes.md"

      - name: Push the tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md"
