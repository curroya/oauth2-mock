name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: docker.io/curroya/oauth2-mock
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  image:
    name: Publish to Docker Hub
    needs: ci
    runs-on: ubuntu-24.04
    environment:
      name: dockerhub
      url: https://hub.docker.com/r/curroya/oauth2-mock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tags
        id: tags
        run: |
          short_sha=$(git rev-parse --short=7 HEAD)
          {
            echo "tags<<EOF"
            echo "$IMAGE:latest"
            echo "$IMAGE:sha-$short_sha"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: The published image serves discovery
        run: |
          docker run -d --name oauth2-mock -p 5556:5556 "$IMAGE:latest"
          for _ in $(seq 1 20); do
            curl -sf http://localhost:5556/.well-known/openid-configuration && exit 0
            sleep 1
          done
          docker logs oauth2-mock
          exit 1
