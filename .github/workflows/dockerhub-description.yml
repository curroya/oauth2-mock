name: dockerhub-description

on:
  push:
    branches: [main]
    paths: [DOCKERHUB.md, .github/workflows/dockerhub-description.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dockerhub-description
  cancel-in-progress: false

jobs:
  description:
    name: Update the Docker Hub description
    runs-on: ubuntu-24.04
    environment:
      name: dockerhub
      url: https://hub.docker.com/r/curroya/oauth2-mock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: curroya/oauth2-mock
          readme-filepath: ./DOCKERHUB.md
          short-description: A tiny OpenID Connect provider for local development and end-to-end tests.
