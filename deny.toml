# An entry in `ignore` is `{ id = "RUSTSEC-YYYY-NNNN", reason = "<why>; review by YYYY-MM-DD" }`;
# bin/check-review-dates fails every check run once that date has passed.
[advisories]
unmaintained = "workspace"
unsound = "all"
yanked = "deny"
unused-ignored-advisory = "deny"
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "rsa has no fixed release; the mock signs ID tokens with a key derived from a public seed, so a timing attack recovers nothing secret; review by 2027-01-29" },
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 comes only through openidconnect 4, a dev-dependency the tests use as the client; nothing in the shipped binary links it; review by 2027-01-29" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
